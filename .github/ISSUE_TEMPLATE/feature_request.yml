name: ✨ 功能建议
description: 新模型支持、新网关适配、行为改进
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 现在的行为哪里不够用？在什么场景下遇到的？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      placeholder: 例如：新增某 *-free 模型的支持 / 计数器窗口的自适应重试
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / 补充信息
